[package]
name = "SolarSim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 's'
lto = "thin"

#[build-dependencies]
#embed-resource = "1.6.3"

[dependencies]
#bevy = { git = "https://github.com/bevyengine/bevy", branch = "release-0.11.3", features = ["dynamic_linking"] } 
bevy = { version = "0.19.1", features = ["jpeg", "file_watcher"] }
#bevy_panorbit_camera = { git = "https://github.com/jan-tennert/bevy_panorbit_camera", rev = "7e3c3f8" }
#bevy-inspector-egui = { version = "0.28.1"}
#bevy_mod_picking = "0.15"
bevy_egui = { version = "0.42.0", features = ["immutable_ctx"] }
jiff = "0.2.41"
serde_json = "1.0.107"
serde = { version = "1.0.189", features = ["derive"] }
bevy_mod_billboard = { git = "https://github.com/kisya-games/bevy_mod_billboard", branch = "bevy-0.19" }
egui-toast = "0.22.0"
tinyfiledialogs = "3.0"
egui_extras = { version = "0.36.0", features = ["datepicker"] }
anise = "0.5.4"
bevy_async_task = "0.13.0"
futures-channel = { version = "0.3.34", features = ["std"] }
bevy_panorbit_camera = { version = "0.35.0", features = ["bevy_egui"] }

